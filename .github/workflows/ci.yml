name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      SENTINEL_LLM: rules            # tests never call the Claude API
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests with coverage
        run: |
          coverage run -m unittest discover -v
          coverage report --fail-under=85
      - name: Detection benchmark (quick)
        if: matrix.python == '3.12'
        run: python -m benchmarks.bench --quick --out bench-out
      - name: Upload the benchmark report
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: bench-out/

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: log-sentinel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the container and exercise the API
        run: |
          docker run -d --name ls -p 8000:8000 log-sentinel:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && break
            sleep 1
          done
          curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:8000/api/analysis | grep -q '"predictions"'
          curl -fsS http://localhost:8000/ | grep -q 'Log Sentinel'
          curl -fsS -X POST http://localhost:8000/api/ingest/metrics -H 'content-type: application/json' \
            -d "{\"points\":[{\"ts\":$(date +%s),\"metric\":\"cpu_pct\",\"value\":42}]}" | grep -q '"accepted":1'
      - name: Container logs
        if: always()
        run: docker logs ls
