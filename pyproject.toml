[project]
name = "log-sentinel"
version = "1.0.0"
description = "AI monitoring that predicts system failures from metrics and logs: anomaly detection, log template mining and time-to-threshold forecasts."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Momchil Borisov" }]
license = { text = "MIT" }
dependencies = [
    "anthropic>=2.2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
logsentinel = "logsentinel.__main__:main"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",    # long strings (prompts, SQL, messages) read better unwrapped
    "B008",    # FastAPI Query() defaults
]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["logsentinel"]
omit = ["logsentinel/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
